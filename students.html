<!DOCTYPE html>
<html lang="en" dir="ltr">
<head> 
  <link rel="stylesheet" href="style.css">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Iraq Edu Platform</title>
    <!-- Link to your existing style.css -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Embedded layout styles that build on your existing CSS -->
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #FF9F43;
            --accent-green: #2ECC71;
            --accent-purple: #9B59B6;
            --bg-soft: #F4F7FE;
            --card-shadow: 0 8px 24px rgba(149, 157, 165, 0.1);
            --border-radius: 16px;
        }

        body {
            background-color: var(--bg-soft);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
      <!-- BEGIN: Student Dashboard Statistic Cards -->
<div class="stats-container">
    <!-- Total Points Card -->
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fas fa-trophy"></i>
        </div>
        <div class="stat-details">
            <span class="stat-title">Total Points</span>
            <h3 class="stat-value">1,250</h3>
        </div>
    </div>

    <!-- Current Rank Card -->
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fas fa-medal"></i>
        </div>
        <div class="stat-details">
            <span class="stat-title">Current Rank</span>
            <h3 class="stat-value">#5</h3>
        </div>
    </div>

    <!-- Completed Quizzes Card -->
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="stat-details">
            <span class="stat-title">Completed Quizzes</span>
            <h3 class="stat-value">24</h3>
        </div>
    </div>

    <!-- Success Rate Card -->
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fas fa-chart-line"></i>
        </div>
        <div class="stat-details">
            <span class="stat-title">Success Rate</span>
            <h3 class="stat-value">92%</h3>
        </div>
    </div>
</div>
<!-- END: Student Dashboard Statistic Cards -->


        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Top Navigation Header */
        .dash-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 700;
            background: #EBF3FA;
            padding: 10px 18px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-home-btn:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Profile Banner */
        .profile-card {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            border-radius: var(--border-radius);
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
