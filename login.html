<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التعلم - تسجيل دخول الطلاب</title>
    <!-- Links to your existing stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Child-friendly Google Font (Cairo/Tajawal) for clean Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* Fallback and custom enhancements extending style.css */
        :root {
            --primary-color: #2b5c8f;
            --secondary-color: #f7b731;
            --accent-green: #2ed573;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef3c7 100%);
            --card-bg: #ffffff;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --border-radius: 20px;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            border: 3px solid #ffffff;
            position: relative;
        }

        /* Top decorative banner with subtle Iraqi flag identity */
        .iraq-accent-bar {
            height: 6px;
            background: linear-gradient(to right, #ce1126 33.3%, #ffffff 33.3%, #ffffff 66.6%, #000000 66.6%);
        }

        .login-header {
            text-align: center;
            padding: 30px 25px 10px 25px;
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #e0f2fe;
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .platform-logo {
            width: 70px;
            height: 70px;
            background: #fff9e6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 12px rgba(247, 183, 49, 0.25);
            font-size: 36px;
        }

        .login-header h1 {
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .login-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .login-form {
            padding: 20px 30px 30px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .input-container {
            position: relative;
        }

        .input-container input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.25s ease;
            outline: none;
            background-color: #f8fafc;
        }

        .input-container input:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(43, 92, 143, 0.15);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: 500;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #1a3a5c;
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(43, 92, 143, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #1f456e;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(43, 92, 143, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-footer {
            background-color: #f8fafc;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: #d97706;
            font-weight: 800;
            text-decoration: none;
            margin-right: 5px;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .login-wrapper {
                border-radius: 16px;
            }
            .login-header {
                padding: 20px 20px 10px 20px;
            }
            .login-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Iraqi Flag Top Bar Accent -->
        <div class="iraq-accent-bar"></div>

        <!-- Card Header -->
        <div class="login-header">
            <div class="platform-badge">
                <span>🇮🇶 منصة العراق التعليمية</span>
            </div>
            <div class="platform-logo">
                🎓
            </div>
            <h1>دخول الطلاب</h1>
            <p>أهلاً بك يا بطل! ادخل حسابك لبدء التعلم اليوم</p>
        </div>

        <!-- Student Login Form -->
        <form class="login-form" action="#" method="POST">
            
            <!-- Username or Email Field -->
            <div class="form-group">
                <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
                <div class="input-container">
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="أدخل اسم المستخدم أو البريد" 
                        required 
                        autocomplete="username"
                    >
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <!-- Options: Remember Me & Forgot Password -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>تذكرني</span>
                </label>
                <a href="forgot-password.html" class="forgot-password">نسيت كلمة المرور؟</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-submit">
                <span>تسجيل الدخول</span>
                <span>🚀</span>
            </button>
        </form>

        <!-- Footer Link: Create Account -->
        <div class="login-footer">
            <span>ليس لديك حساب طالب؟</span>
            <a href="register.html">أنشئ حساباً جديداً</a>
        </div>
    </div>

</body>
</html>
